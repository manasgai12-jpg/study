<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gai Wanted">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080D18">
<title>Gai Wanted</title>
<style>
/* ============================================================
   DESIGN TOKENS  (carried over from v1 — unchanged)
   ============================================================ */
:root{
  --bg:#080D18;
  --bg-2:#0B1324;
  --surface:#111B31;
  --raised:#18243F;
  --raised-2:#1F2D4C;
  --line:rgba(140,170,220,.13);
  --line-2:rgba(140,170,220,.22);

  --ink:#EDF3FC;
  --ink-2:#B9C7DF;
  --mute:#7F90AE;

  --sky:#4CC2FF;
  --electric:#5B7CFA;
  --mint:#3EE0A0;
  --mint-d:#16A46E;
  --red:#FF7B6B;
  --gold:#FFC759;

  --r-s:12px; --r-m:18px; --r-l:24px; --r-xl:30px;
  --nav-h:64px;
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);

  --e1:0 1px 2px rgba(0,0,0,.4);
  --e2:0 6px 20px rgba(0,0,0,.34);
  --pad:20px;
  --ease:cubic-bezier(.22,.8,.28,1);
  --spring:cubic-bezier(.2,1.06,.32,1);

  /* mastery scale */
  --lv0:#7F90AE; --lv1:#FF7B6B; --lv2:#FFC759; --lv3:#4CC2FF; --lv4:#3EE0A0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.45;min-height:100dvh;
  overflow-x:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.022em;line-height:1.16}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:0;height:0}

/* ============================================================
   SHELL + NAV
   ============================================================ */
#app{position:relative;z-index:1;min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--sab) + 14px)}
.scr{padding:calc(var(--sat) + 14px) var(--pad) 30px;max-width:640px;margin:0 auto;animation:sIn .22s var(--ease) both}
@keyframes sIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.scr.full{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:14px}

#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);
  display:flex;background:rgba(11,19,36,.86);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border-top:1px solid var(--line);
}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--mute);font-size:10px;font-weight:700;min-height:48px;transition:color .15s}
#nav button svg{width:22px;height:22px;transition:transform .2s var(--spring)}
#nav button[aria-current]{color:var(--sky)}
#nav button[aria-current] svg{transform:translateY(-1px) scale(1.06)}
#nav button:active svg{transform:scale(.85)}

/* desktop sidebar */
@media (min-width:900px){
  #app{padding-bottom:30px;padding-left:230px}
  .scr{max-width:900px}
  #nav{top:0;right:auto;width:230px;height:100dvh;flex-direction:column;justify-content:flex-start;
    padding:calc(var(--sat) + 74px) 14px 20px;border-top:0;border-right:1px solid var(--line);gap:4px}
  #nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;font-size:14.5px;
    padding:13px 15px;border-radius:14px;width:100%}
  #nav button[aria-current]{background:var(--raised)}
  #nav::before{content:"Gai Wanted";position:absolute;top:calc(var(--sat) + 26px);left:22px;
    font-size:17px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
}

/* ============================================================
   PRIMITIVES  (#65 — lists & typography, not everything in a box)
   ============================================================ */
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:800}
.sect{display:flex;align-items:baseline;gap:10px;margin:26px 0 11px}
.sect h3{font-size:14px;flex:1;letter-spacing:.01em}
.sect .lnk{font-size:13px;font-weight:700;color:var(--sky)}
.hr{height:1px;background:var(--line);margin:14px 0}

.tbar{display:flex;align-items:center;gap:11px;min-height:44px;margin-bottom:16px}
.tbar .grow{flex:1;min-width:0}
.tbar h2{font-size:20px}
.tbar .sub{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;flex:none;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);transition:transform .12s var(--ease)}
.ib:active{transform:scale(.9)}
.ib svg{width:19px;height:19px}
.ib .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);
  transform:translate(13px,-13px);border:2px solid var(--bg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  padding:14px 18px;border-radius:var(--r-m);font-weight:800;font-size:15.5px;letter-spacing:-.01em;
  transition:transform .11s var(--ease),opacity .15s}
.btn:active{transform:scale(.976)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn svg{width:18px;height:18px}
.btn+.btn{margin-top:9px}
.b-pri{background:linear-gradient(150deg,var(--sky),var(--electric));color:#04101E;box-shadow:0 5px 16px rgba(91,124,250,.26)}
.b-sec{background:var(--raised);color:var(--ink);border:1px solid var(--line)}
.b-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.b-mint{background:linear-gradient(150deg,var(--mint),var(--mint-d));color:#03150D}
.b-dang{background:rgba(255,123,107,.12);color:var(--red);border:1px solid rgba(255,123,107,.3)}
.b-sm{min-height:42px;font-size:14px;padding:10px 15px;border-radius:13px;width:auto}
.brow{display:flex;gap:9px}
.brow .btn{margin-top:0}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:11px;background:var(--surface);border:1.5px solid transparent;
  font-size:13.5px;font-weight:700;color:var(--mute);min-height:40px;transition:all .13s var(--ease)}
.chip[aria-pressed="true"]{background:var(--raised-2);color:var(--ink);border-color:var(--sky)}
.chip:active{transform:scale(.95)}

/* list rows — the main structural unit, replaces card-everything */
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:13px;padding:14px 2px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:opacity .12s}
.li:active{opacity:.6}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--raised)}
.li .ic svg{width:19px;height:19px}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid span{font-size:12.5px;color:var(--mute);display:block;margin-top:1px}
.li .rt{font-size:13.5px;color:var(--mute);font-weight:700;flex:none;text-align:right}
.li .chev{color:var(--mute);width:15px;flex:none;display:flex;opacity:.6}
.li .chev svg{width:15px;height:15px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:17px}

.bar{height:6px;border-radius:4px;background:rgba(140,170,220,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sky),var(--mint));
  transition:width .5s var(--ease)}
.bar.sm{height:4px}

.ring{transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-linecap:round}
.ring .t{stroke:rgba(140,170,220,.15)}
.ring .v{transition:stroke-dashoffset .6s var(--ease)}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}

.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;font-size:16px;transition:border-color .15s}
.inp:focus{border-color:var(--sky)}
textarea.inp{min-height:140px;resize:vertical;font-size:15px;line-height:1.5}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:11px;font-weight:800;color:var(--mute);margin-bottom:6px;
  letter-spacing:.1em;text-transform:uppercase}

.sw{width:48px;height:29px;border-radius:15px;background:var(--raised-2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:var(--mute);transition:transform .22s var(--spring),background .2s}
.sw[aria-pressed="true"]{background:var(--electric)}
.sw[aria-pressed="true"]::after{transform:translateX(19px);background:#fff}

.empty{text-align:center;padding:42px 18px}
.empty h3{font-size:16.5px;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--mute);margin-bottom:18px;line-height:1.55}
.empty .art{opacity:.3;margin-bottom:14px;display:flex;justify-content:center}

/* ============================================================
   HOME
   ============================================================ */
.greet{font-size:13px;color:var(--mute);font-weight:700}
.greet+h1{font-size:26px;margin:3px 0 18px;letter-spacing:-.035em}

.snap{display:flex;align-items:center;gap:16px;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.snap .col{flex:1;min-width:0}
.snap .n{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.snap .l{font-size:11px;color:var(--mute);font-weight:700;margin-top:5px}
.snap .vr{width:1px;align-self:stretch;background:var(--line)}

.resume{background:linear-gradient(150deg,#1A2A4A,#121D33 65%);border:1px solid var(--line-2);
  border-radius:var(--r-xl);padding:19px;position:relative;overflow:hidden}
.resume::after{content:"";position:absolute;right:-46px;top:-52px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,194,255,.2),transparent 70%)}
.resume .rel{position:relative;z-index:1}

.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:14px 6px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);
  min-height:78px;transition:transform .12s var(--ease)}
.qa button:active{transform:scale(.95)}
.qa button svg{width:20px;height:20px}
.qa button span{font-size:11.5px;font-weight:700;color:var(--ink-2)}

.reco{display:flex;gap:13px;align-items:flex-start;padding:15px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);margin-bottom:9px;width:100%;text-align:left;
  transition:transform .12s var(--ease)}
.reco:active{transform:scale(.98)}
.reco .ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center}
.reco .ic svg{width:18px;height:18px}
.reco .tx{flex:1;min-width:0}
.reco .tx b{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
.reco .tx span{font-size:12.5px;color:var(--mute);line-height:1.42;display:block}
.reco .go{font-size:12.5px;font-weight:800;color:var(--sky);flex:none;align-self:center}

/* ============================================================
   STUDY SESSION
   ============================================================ */
.shd{display:flex;align-items:center;gap:11px;margin-bottom:12px;min-height:42px}
.shd .ctr{flex:1}
.shd .cnt{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin-bottom:6px}
.shd .cnt small{color:var(--mute);font-weight:700}
.stk{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;min-height:36px}
.stk.hot{border-color:rgba(62,224,160,.4);color:var(--mint);background:rgba(62,224,160,.07)}
.stk svg{width:16px;height:16px}

.qtype{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qtype .tag{background:rgba(76,194,255,.13);color:var(--sky)}
.qtype .topic{font-size:11px;color:var(--mute);font-weight:700}
.qtxt{font-size:19.5px;line-height:1.45;font-weight:600;margin-bottom:20px}

.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;
  border-radius:var(--r-m);background:var(--surface);border:1.5px solid var(--line);margin-bottom:9px;
  font-size:15.5px;font-weight:600;line-height:1.35;min-height:54px;
  transition:transform .11s var(--ease),border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .mk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);
  display:grid;place-items:center;transition:all .15s}
.opt .mk.sq{border-radius:7px}
.opt .mk svg{width:12px;height:12px;opacity:0;transition:opacity .12s}
.opt .tx{flex:1}
.opt[aria-checked="true"] .mk{background:var(--sky);border-color:var(--sky);color:#04101E}
.opt[aria-checked="true"] .mk svg{opacity:1}
.opt[aria-checked="true"]{border-color:var(--sky)}
.opt.ok{border-color:var(--mint);background:rgba(62,224,160,.1)}
.opt.ok .mk{background:var(--mint);border-color:var(--mint);color:#03150D}
.opt.ok .mk svg{opacity:1}
.opt.bad{border-color:var(--red);background:rgba(255,123,107,.09)}
.opt.bad .mk{background:var(--red);border-color:var(--red);color:#1A0505}
.opt.bad .mk svg{opacity:1}
.opt.dim{opacity:.38}
.opt.shake{animation:shk .32s var(--ease)}
@keyframes shk{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}44%{transform:translateX(5px)}70%{transform:translateX(-2px)}}

/* compact feedback (#16 #18 — small, not a takeover) */
.fb{margin-top:14px;animation:fbIn .2s var(--ease) both}
@keyframes fbIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fb .hd{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;margin-bottom:6px}
.fb .hd svg{width:16px;height:16px}
.fb.ok .hd{color:var(--mint)}
.fb.bad .hd{color:var(--red)}
.fb .ans{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.fb .why{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.fb .more{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.fb .more button{font-size:12.5px;font-weight:800;color:var(--sky);padding:7px 12px;border-radius:10px;
  background:rgba(76,194,255,.09);border:1px solid rgba(76,194,255,.2);min-height:36px}
.fb .exp{margin-top:11px;padding:13px 14px;border-radius:14px;background:var(--raised);
  font-size:13.5px;line-height:1.6;color:var(--ink-2)}

.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + var(--sab));
  background:linear-gradient(to top,var(--bg) 60%,transparent);margin-top:auto}

/* flashcards */
.stage{perspective:1500px;margin:6px 0 16px;touch-action:pan-y}
.fc{position:relative;width:100%;height:min(48vh,380px);min-height:260px;transform-style:preserve-3d;
  transition:transform .48s var(--ease);will-change:transform}
.fc.flip{transform:rotateY(180deg)}
.fc.drag{transition:none}
.fc.snap{transition:transform .36s var(--spring)}
.fc.out{transition:transform .26s ease-in,opacity .26s ease-in}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);
  padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden}
.face.b{transform:rotateY(180deg);background:linear-gradient(160deg,var(--raised),#131E36)}
.face .eyebrow{position:absolute;top:18px;left:22px}
.face .fav{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;color:var(--mute)}
.face .fav.on{color:var(--gold)}
.face .fav svg{width:19px;height:19px}
.face .tip{position:absolute;bottom:16px;font-size:11.5px;color:var(--mute);font-weight:600}
.f-q{font-size:19px;line-height:1.45;font-weight:500}
.f-a{font-size:25px;line-height:1.25;font-weight:800;letter-spacing:-.025em;color:var(--mint)}
.ovl{position:absolute;inset:0;border-radius:var(--r-xl);display:grid;place-items:center;opacity:0;
  pointer-events:none;backface-visibility:hidden}
.ovl b{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;padding:10px 18px;border-radius:999px;border:2px solid currentColor}
.ovl svg{width:17px;height:17px}
.ovl.n{background:linear-gradient(90deg,rgba(255,123,107,.24),transparent 60%);color:var(--red);
  justify-items:start;padding-left:20px}
.ovl.y{background:linear-gradient(270deg,rgba(62,224,160,.24),transparent 60%);color:var(--mint);
  justify-items:end;padding-right:20px}
.rate4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.rate4 button{padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:800;min-height:54px;display:flex;flex-direction:column;gap:3px;
  align-items:center;justify-content:center;transition:transform .11s}
.rate4 button:active{transform:scale(.94)}
.rate4 button small{font-size:9.5px;font-weight:700;color:var(--mute)}

/* games */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mtile{padding:14px 11px;border-radius:15px;background:var(--surface);border:1.5px solid var(--line);
  font-size:13px;font-weight:600;line-height:1.35;min-height:88px;display:flex;align-items:center;
  text-align:left;transition:all .14s var(--ease)}
.mtile[aria-pressed="true"]{border-color:var(--sky);background:var(--raised-2)}
.mtile.gone{opacity:0;pointer-events:none;transform:scale(.86)}
.mtile.bad{border-color:var(--red);animation:shk .3s}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(4,8,16,.7);animation:fIn .2s ease both}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;background:var(--bg-2);border-radius:26px 26px 0 0;
  border-top:1px solid var(--line-2);padding:10px var(--pad) calc(20px + var(--sab));
  max-height:88dvh;overflow-y:auto;animation:up .28s var(--ease) both;max-width:640px;margin:0 auto}
@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheet .grab{width:36px;height:4px;border-radius:3px;background:var(--line-2);margin:0 auto 15px}
#sheet h3{font-size:17.5px;margin-bottom:13px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 16px);z-index:70;
  transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;background:var(--raised-2);
  border:1px solid var(--line-2);border-radius:999px;padding:10px 19px;font-size:13.5px;font-weight:700;
  white-space:nowrap;transition:opacity .22s,transform .28s var(--spring);max-width:92vw;
  overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
#mark{position:fixed;right:-24vw;top:12vh;width:94vw;max-width:540px;aspect-ratio:1;z-index:0;pointer-events:none;opacity:.55}
#mark svg{width:100%!important;height:100%!important;display:block}

#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
  transition:opacity .4s var(--ease),visibility .4s}
#splash.gone{opacity:0;visibility:hidden}
#splash .in{display:flex;flex-direction:column;align-items:center}
#splash .lg{animation:lgIn .68s var(--spring) both}
#splash .nm{margin-top:18px;font-size:25px;font-weight:800;letter-spacing:-.035em;animation:nIn .45s var(--ease) .26s both}
#splash .tg{margin-top:5px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
  font-weight:800;animation:nIn .45s var(--ease) .4s both}
@keyframes lgIn{0%{opacity:0;transform:scale(.5) rotate(-38deg)}100%{opacity:1;transform:none}}
@keyframes nIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}


/* ---------- PROGRESS CHECKPOINT ---------- */
.ckpt{animation:ckIn .3s var(--ease) both}
@keyframes ckIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ck-hero{text-align:center;padding:10px 0 4px}
.ck-score{font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:10px 0 2px}
.ck-score small{font-size:22px;color:var(--mute);font-weight:800;margin-left:4px}
.ck-line{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.ck-sub{font-size:13px;color:var(--mute);font-weight:600;margin-top:4px;line-height:1.5}
.ck-list{display:flex;flex-direction:column;gap:8px}
.ck-row{display:flex;gap:12px;padding:13px 14px;border-radius:var(--r-m);background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--line);
  animation:ckRow .32s var(--ease) both}
@keyframes ckRow{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.ck-row.ok{border-left-color:var(--mint)}
.ck-row.bad{border-left-color:var(--red)}
.ck-mk{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px}
.ck-mk svg{width:12px;height:12px}
.ck-row.ok .ck-mk{background:rgba(62,224,160,.16);color:var(--mint)}
.ck-row.bad .ck-mk{background:rgba(255,123,107,.14);color:var(--red)}
.ck-body{flex:1;min-width:0}
.ck-q{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:7px}
.ck-a{font-size:13.5px;font-weight:700;line-height:1.4;margin-bottom:3px;
  display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.ck-a span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800;flex:none}
.ck-a.good{color:var(--mint)}
.ck-a.mine{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(255,123,107,.5)}
.ck-a.mine span{text-decoration:none}
.ck-topic{font-size:11px;color:var(--mute);font-weight:700;margin-top:5px}

/* ---------- DECK MODE GRID ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mode{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:var(--r-m);
  background:var(--surface);border:1px solid var(--line);min-height:64px;text-align:left;
  transition:transform .12s var(--ease),border-color .16s}
.mode:active{transform:scale(.96)}
.mode .mi{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center}
.mode .mi svg{width:18px;height:18px}
.mode b{font-size:14.5px;font-weight:700;display:block}
.mode small{font-size:11px;color:var(--mute);font-weight:600;display:block;margin-top:1px}

/* ---------- 3-STATE PROGRESS ---------- */
.p3{display:flex;flex-direction:column;gap:2px}
.p3 button{display:flex;align-items:center;gap:13px;padding:15px 2px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:opacity .12s}
.p3 button:last-child{border-bottom:0}
.p3 button:active{opacity:.6}
.p3 .sw3{width:11px;height:11px;border-radius:50%;flex:none}
.p3 .l3{flex:1;font-size:15px;font-weight:700}
.p3 .n3{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.p3 .chev{width:15px;display:flex;color:var(--mute);opacity:.55}
.p3 .chev svg{width:15px;height:15px}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;background:rgba(140,170,220,.12);margin:4px 0 14px}
.stack i{display:block;height:100%;transition:width .6s var(--ease)}

/* ---------- TERMS LIST ---------- */
.term{display:flex;gap:13px;padding:15px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.term:last-child{border-bottom:0}
.term .tsw{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px}
.term .tb{flex:1;min-width:0}
.term .tt{font-size:15.5px;font-weight:700;line-height:1.35}
.term .td{font-size:14px;color:var(--ink-2);line-height:1.5;margin-top:5px}
.term .tm{font-size:11px;color:var(--mute);font-weight:700;margin-top:7px}
.term .tf{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:transparent;color:var(--mute);margin:-4px -6px 0 0}
.term .tf.on{color:var(--gold)}
.term .tf svg{width:17px;height:17px}

/* ---------- ANSWER POP ---------- */
.opt.ok{animation:pop .3s var(--spring)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.022)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

/* clover: leaves petals, optional G medallion */
function clover(n,size,o){o=o||{};const f=o.fill||'currentColor';let p='';
for(let i=0;i<n;i++){const a=(360/n)*i;
p+=`<g transform="rotate(${a})"><path d="M0 -3C-8.6 -5.4 -12.4 -12 -8.5 -16.6c3.3-3.9 10.1-3 12.9 2C6 -11.7 4.6 -6 0 -3Z" fill="${f}"/></g>`;}
const st=o.stem===false?'':`<path d="M0 2.4C1.6 9 2.4 13.6 6.6 19.4" stroke="${f}" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/>`;
const g=o.g?`<circle cx="0" cy="-1.4" r="8.6" fill="${o.gBg||'#4CC2FF'}"/><text x="0" y="2.7" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12.5" font-weight="800" fill="${o.gFg||'#04101E'}">G</text>`:'';
return `<svg width="${size}" height="${size}" viewBox="-26 -26 52 52" style="display:block;overflow:visible"><g>${p}</g>${st}${g}</svg>`;}

/* Nothing here should ever hand the user a blank screen. A stray error gets
   logged and surfaced quietly instead of killing the session. */
let ERRN=0;
function softFail(where,e){
  ERRN++;
  try{console.warn('[gai-wanted]',where,e&&e.message||e);}catch(_){}
  if(ERRN<=2){try{toast('Something hiccupped — your progress is saved');}catch(_){}}
}
addEventListener('error',e=>softFail('window',e.error||e.message));
addEventListener('unhandledrejection',e=>{softFail('promise',e.reason);
  if(e.preventDefault)e.preventDefault();});

/* ---------------------------------------------------------------- UTIL -- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
const DAY=86400000;
const dayKey=(t)=>{const d=new Date(t||now());return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function ago(t){if(!t)return'never';const m=Math.floor((now()-t)/60000);
 if(m<1)return'just now';if(m<60)return m+'m ago';const h=(m/60)|0;if(h<24)return h+'h ago';
 const d=(h/24)|0;return d===1?'yesterday':d+'d ago';}
function fmtDur(s){const m=(s/60)|0;if(m<60)return m+'m';return ((m/60)|0)+'h '+(m%60)+'m';}
const REDUCED=(()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
  catch(e){return false;}})();
function buzz(p){if(DB&&DB.prefs.haptics&&navigator.vibrate)try{navigator.vibrate(p);}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
 clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2000);}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}

/* --------------------------------------------------------------- STORE -- */
const KEY='gaiwanted:v2';
const Store={mem:null,_t:null,
 async load(){
   try{const r=await Promise.resolve(window.storage.get(KEY)).catch(()=>null);
       if(r&&r.value)return JSON.parse(r.value);}catch(e){}
   try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v);}catch(e){}
   return this.mem;},
 write(d){
   const j=JSON.stringify(d);
   try{localStorage.setItem(KEY,j);}catch(e){}
   // try/catch does NOT catch a rejected promise — it needs its own handler
   try{const r=window.storage&&window.storage.set(KEY,j);
       if(r&&typeof r.catch==='function')r.catch(()=>{});}catch(e){}},
 save(d){this.mem=d;clearTimeout(this._t);this._t=setTimeout(()=>this.write(d),260);},
 flush(d){clearTimeout(this._t);this.write(d||this.mem);}};
addEventListener('pagehide',()=>{try{Store.flush(DB);}catch(e){}});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')try{Store.flush(DB);}catch(e){}});
let DB=null;
/* One pass over the card table instead of re-scanning it per deck.
   Library with 20 decks x 1500 cards went from ~30k filter ops to one. */
let IDX=null;
function index(){
  if(IDX)return IDX;
  IDX={byDeck:{},byCourse:{}};
  for(const c of Object.values(DB.cards)){
    (IDX.byDeck[c.deckId]||(IDX.byDeck[c.deckId]=[])).push(c);
    (IDX.byCourse[c.courseId]||(IDX.byCourse[c.courseId]=[])).push(c);
  }
  return IDX;
}
function save(){IDX=null;Store.save(DB);}

/* =================================================================== MODEL */
/* courses{} decks{} cards{} prog{} sessions[] resume goals daily streak prefs recent */

const Course={
 all(inc){return Object.values(DB.courses).filter(c=>inc||!c.archived)
   .sort((a,b)=>(b.lastStudied||b.created)-(a.lastStudied||a.created));},
 get(id){return DB.courses[id];},
 add(name,code,color){const id=uid('co');
   DB.courses[id]={id,name:name||'New course',code:code||'',color:color||'#4CC2FF',
     archived:false,fav:false,exam:null,created:now(),lastStudied:0};save();return id;},
 decks(id){return Deck.all().filter(d=>d.courseId===id);},
 cards(id){return index().byCourse[id]||[];},
 del(id){Course.decks(id).forEach(d=>Deck.del(d.id));delete DB.courses[id];save();}
};

const Deck={
 all(inc){return Object.values(DB.decks).filter(d=>inc||!d.archived)
   .sort((a,b)=>(b.lastStudied||b.created)-(a.lastStudied||a.created));},
 get(id){return DB.decks[id];},
 add(courseId,name){const id=uid('dk');
   DB.decks[id]={id,courseId,name:name||'New deck',archived:false,fav:false,created:now(),lastStudied:0};
   save();return id;},
 cards(id){return index().byDeck[id]||[];},
 del(id){Deck.cards(id).forEach(c=>{delete DB.cards[c.id];delete DB.prog[c.id];});
   delete DB.decks[id];save();},
 touch(id){const d=DB.decks[id];if(!d)return;d.lastStudied=now();
   const c=DB.courses[d.courseId];if(c)c.lastStudied=now();
   DB.recent=[{t:'deck',id,at:now()},...(DB.recent||[]).filter(r=>!(r.t==='deck'&&r.id===id))].slice(0,10);}
};

const Card={

/* ------------------------------------------------------- SRS + MASTERY -- */
/* Levels (#23): 0 NEW · 1 LEARNING · 2 FAMILIAR · 3 STRONG · 4 MASTERED
   Leitner box drives the interval; level needs sustained retrieval.       */
const LV=['New','Learning','Familiar','Strong','Mastered'];
const LVC=['var(--lv0)','var(--lv1)','var(--lv2)','var(--lv3)','var(--lv4)'];
const IVL=[0,1,2,4,9,19];          // days per box

const P={
 get(id){return DB.prog[id]||(DB.prog[id]={a:0,c:0,w:0,streak:0,box:0,lv:0,last:0,due:0,ease:2.5,miss:0});},
 lvOf(id){const p=DB.prog[id];if(!p||!p.a)return 0;return p.lv;},
 acc(id){const p=DB.prog[id];return p&&p.a?p.c/p.a:0;},
 due(id){const p=DB.prog[id];return p&&p.a>0&&p.due<=now();},
 /** grade: 0 again · 1 hard · 2 good · 3 easy   (mc/tf/wr map wrong→0 right→2) */
 mark(id,grade){
   const p=P.get(id);p.a++;p.last=now();
   if(grade===0){
     p.w++;p.miss++;p.streak=0;
     p.box=Math.max(0,p.box-2);
     p.lv=Math.max(1,p.lv-1);
     p.ease=Math.max(1.3,p.ease-0.2);
   }else{
     p.c++;p.streak++;
     p.box=Math.min(5,p.box+(grade===3?2:1));
     if(grade===1)p.ease=Math.max(1.3,p.ease-0.15);
     if(grade===3)p.ease=Math.min(3.2,p.ease+0.1);
     // level advances on sustained correct retrieval, never on one hit
     if(p.lv===0)p.lv=1;
     else if(p.streak>=2&&p.lv<2)p.lv=2;
     else if(p.streak>=3&&p.lv<3)p.lv=3;
     else if(p.streak>=4&&p.box>=4&&P.acc(id)>=.75)p.lv=4;
   }
   const days=IVL[p.box]*(p.lv>=3?p.ease/2.5:1);
   p.due=now()+Math.max(0,days)*DAY;
   Stats.log(grade>0);
   return p;
 },
 reset(){DB.prog={};save();}
};

/* topics are card-level strings; empty topic falls back to deck name */
const Topic={
 of(c){return c.topic||(DB.decks[c.deckId]||{}).name||'General';},
 map(cards){const m={};cards.forEach(c=>{const t=Topic.of(c);(m[t]=m[t]||[]).push(c);});return m;},
 mastery(cards){if(!cards.length)return 0;
   return Math.round(cards.reduce((a,c)=>a+P.lvOf(c.id),0)/(cards.length*4)*100);},
 accuracy(cards){let a=0,c=0;cards.forEach(x=>{const p=DB.prog[x.id];if(p){a+=p.a;c+=p.c;}});
   return a?c/a:null;},
 weak(cards,limit){
   const m=Topic.map(cards),out=[];
   for(const[name,list]of Object.entries(m)){
     const att=list.reduce((a,c)=>a+((DB.prog[c.id]||{}).a||0),0);
     if(att<3)continue;
     const acc=Topic.accuracy(list);
     if(acc!=null&&acc<0.75)out.push({name,list,acc,att,missed:list.reduce((a,c)=>a+((DB.prog[c.id]||{}).w||0),0)});
   }
   out.sort((a,b)=>a.acc-b.acc);
   return limit?out.slice(0,limit):out;
 }
};

 today(){const k=dayKey();if(!DB.daily||DB.daily.k!==k)DB.daily={k,a:0,c:0,secs:0};return DB.daily;},
 log(ok){const t=Stats.today();t.a++;if(ok)t.c++;Stats.streakTick();},
 streakTick(){const k=dayKey(),s=DB.streak||(DB.streak={n:0,last:''});

 allCards(){return Object.values(DB.cards);},
 accuracy(){let a=0,c=0;Object.values(DB.prog).forEach(p=>{a+=p.a;c+=p.c;});return a?Math.round(c/a*100):0;},
 answered(){return Object.values(DB.prog).reduce((x,p)=>x+p.a,0);},
 studySecs(){return (DB.sessions||[]).reduce((a,s)=>a+(s.secs||0),0);},
 dueCount(cards){return (cards||Stats.allCards()).filter(c=>P.due(c.id)).length;},
 tests(){return (DB.sessions||[]).filter(s=>s.mode==='test');},
 week(){const out=[];for(let i=6;i>=0;i--){const k=dayKey(now()-i*DAY);

const FX=(function(){
 const cv=$('#fx'),ctx=cv.getContext('2d');let ps=[],raf=0;
 function size(){const r=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*r;cv.height=innerHeight*r;
   cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(r,0,0,r,0,0);}
 size();addEventListener('resize',size);
 function petal(g,r){g.moveTo(0,-r*.24);
   g.bezierCurveTo(-r*.72,-r*.45,-r*1.02,-r,-r*.7,-r*1.35);
   g.bezierCurveTo(-r*.42,-r*1.66,r*.14,-r*1.6,r*.36,-r*1.2);
   g.bezierCurveTo(r*.5,-r*.96,r*.38,-r*.5,0,-r*.24);}
 function draw(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.wob));
   ctx.globalAlpha=p.al;ctx.fillStyle=p.col;
   for(let i=0;i<p.lv;i++){ctx.save();ctx.rotate(Math.PI*2/p.lv*i);ctx.beginPath();petal(ctx,p.r);ctx.fill();ctx.restore();}
   ctx.strokeStyle=p.col;ctx.lineWidth=p.r*.17;ctx.lineCap='round';ctx.beginPath();
   ctx.moveTo(0,p.r*.2);ctx.quadraticCurveTo(p.r*.24,p.r*.9,p.r*.55,p.r*1.5);ctx.stroke();ctx.restore();}
 function frame(){ctx.clearRect(0,0,innerWidth,innerHeight);
   for(let i=ps.length-1;i>=0;i--){const p=ps[i];
     p.x+=Math.cos(p.a)*p.v+p.dr;p.y+=Math.sin(p.a)*p.v+p.g*3;p.v*=.915;p.rot+=p.sp;p.wob+=.09;p.tk++;
     p.al=1-p.tk/p.tks;
     if(p.tk>=p.tks||p.y>innerHeight+80)ps.splice(i,1);else draw(p);}
   raf=ps.length?requestAnimationFrame(frame):0;}
 const G=['#3EE0A0','#2FB77E','#5CE8AE','#16A46E','#8CF0C8'];
 return{burst(o){o=o||{};if(REDUCED||(DB&&!DB.prefs.celebrate))return;
   const n=o.count||42,ox=(o.x??.5)*innerWidth,oy=(o.y??.72)*innerHeight,lv=o.leaves||4;
   for(let i=0;i<n;i++){const sp=(o.spread||92)*Math.PI/180;
     ps.push({x:ox,y:oy,a:-Math.PI/2-sp/2+Math.random()*sp,v:(o.speed||13)*(.5+Math.random()),
       g:o.grav||.42,dr:(Math.random()-.5)*.7,rot:Math.random()*6.28,sp:(Math.random()-.5)*.26,
       wob:Math.random()*6.28,r:(o.size||8)*(.7+Math.random()*.7),lv,
       col:G[(Math.random()*G.length)|0],tk:0,tks:o.tks||150,al:1});}
   if(!raf)raf=requestAnimationFrame(frame);}};
})();

 save();return co;
}
</script>
<script>
/* ================================================================ SHARED */
function pill(lv){return `<span class="tag" style="background:${LVC[lv]}22;color:${LVC[lv]}">${LV[lv]}</span>`;}
function ringHTML(pct,size,stroke,color){
 const r=(size-stroke)/2,c=2*Math.PI*r;
 return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <circle class="t" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
  <circle class="v" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
   stroke="${color||'var(--mint)'}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/></svg>`;}
function courseRow(c){
 const cards=Course.cards(c.id),m=Topic.mastery(cards),due=Stats.dueCount(cards);
 return `<button class="li" data-go="course" data-arg="${c.id}">
  <span class="ic" style="background:${c.color}1E;color:${c.color}">${I.book}</span>
  <span class="mid"><b>${esc(c.code?c.code+' — '+c.name:c.name)}</b>
   <span>${Course.decks(c.id).length} decks · ${cards.length} cards${due?` · ${due} due`:''}</span>
   <span class="bar sm" style="margin-top:7px;display:block"><i style="width:${m}%"></i></span></span>
  <span class="rt">${m}%</span><span class="chev">${I.chev}</span></button>`;}
function deckRow(d){
 const cards=Deck.cards(d.id),m=Topic.mastery(cards),due=cards.filter(c=>P.due(c.id)).length;
 const co=Course.get(d.courseId)||{color:'var(--sky)'};
 return `<button class="li" data-go="deck" data-arg="${d.id}">
  <span class="ic" style="background:${co.color}1A;color:${co.color}">${I.cards}</span>
  <span class="mid"><b>${esc(d.name)}</b>
   <span>${cards.length} cards · ${m}% mastered${due?` · ${due} due`:''} · ${ago(d.lastStudied)}</span></span>
  <span class="rt">${d.fav?`<span style="color:var(--gold)">${I.star}</span>`:''}</span>
  <span class="chev">${I.chev}</span></button>`;}
function cardRow(c,opts){opts=opts||{};
 const lv=P.lvOf(c.id),p=DB.prog[c.id];
 return `<div class="li" ${opts.sel?`data-pick="${c.id}"`:''}>
  <span style="width:8px;height:8px;border-radius:50%;background:${LVC[lv]};flex:none"></span>
  <span class="mid"><b>${esc(c.t)}</b><span style="white-space:normal">${esc(c.d)}</span>
   <span style="margin-top:5px">${pill(lv)} <span style="font-size:11px;color:var(--mute)">${Topic.of(c)}${p&&p.a?` · ${p.c}/${p.a} correct`:''}</span></span></span>
  <button class="ib" data-fav="${c.id}" style="width:36px;height:36px;background:transparent;border:0;color:${c.fav?'var(--gold)':'var(--mute)'}"
   aria-label="Favorite">${c.fav?I.star:I.starO}</button></div>`;}
function bindFav(){$$('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();
 const c=DB.cards[b.dataset.fav];if(!c)return;c.fav=!c.fav;save();
 b.style.color=c.fav?'var(--gold)':'var(--mute)';b.innerHTML=c.fav?I.star:I.starO;buzz(8);});}

/* ================================================================== HOME */

 if(!all.length)return SCREENS.onboard();
 return `<div class="scr">
  <div class="tbar">
   <div class="grow"><div class="greet">${greet}</div>
    <h1 style="margin:2px 0 0">Ready to study?</h1></div>

  <div class="snap">

  ${DB.resume&&DB.resume.i<DB.resume.queue.length?`

    <button class="btn b-sec" id="rsx" style="flex:0 0 38%">Discard</button></div>
  </div></div>`:''}

  <div class="sect"><h3>Quick actions</h3></div>

   <button data-go="study"><span style="color:var(--mint)">${I.brain}</span><span>Learn</span></button>

   <button id="qaReview"><span style="color:var(--electric)">${I.review}</span><span>Review</span></button>
   <button data-go="newdeck"><span style="color:var(--ink-2)">${I.plus}</span><span>Create</span></button>
   <button data-go="import"><span style="color:var(--ink-2)">${I.up}</span><span>Import</span></button>
  </div>

  ${recos.length?`<div class="sect"><h3>Up next</h3></div>
   ${recos.map((r,i)=>`<button class="reco" data-reco="${i}">
    <span class="ic" style="background:${r.c}1E;color:${r.c}">${r.ic}</span>
    <span class="tx"><b>${esc(r.t)}</b><span>${esc(r.s)}</span></span>
    <span class="go">Start</span></button>`).join('')}`:''}

  ${DB.recent&&DB.recent.length?`<div class="sect"><h3>Recent</h3><button class="lnk" data-go="library">Library</button></div>
   <div class="lst">${DB.recent.slice(0,4).map(r=>{const d=Deck.get(r.id);if(!d)return'';
     return deckRow(d);}).join('')}</div>`:''}
 </div>`;
};
WIRE.home=()=>{
 const recos=recommendations();
 $$('[data-reco]').forEach(b=>b.onclick=()=>{buzz(8);recos[+b.dataset.reco].go();});
 const r=$('#rsm');if(r)r.onclick=()=>resumeSession();
 const x=$('#rsx');if(x)x.onclick=()=>{DB.resume=null;save();paint();toast('Session discarded');};
 $('#bell').onclick=()=>notifSheet();
 const all=Stats.allCards();
 $('#qaFlash').onclick=()=>pickScope('flash');
 $('#qaTest').onclick=()=>pickScope('testsetup');
 $('#qaReview').onclick=()=>{const due=all.filter(c=>P.due(c.id));
  due.length?startSession('review',{cards:due,label:'Due review'}):go('review');};
};
function notifSheet(){
 const n=notifications();
 sheet('Notifications',n.length?`<div class="lst">${n.map((x,i)=>`<button class="li" data-n="${i}">
  <span class="mid"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></span><span class="chev">${I.chev}</span></button>`).join('')}</div>
  <button class="btn b-ghost" style="margin-top:14px" id="nset">Notification settings</button>`
 :`<p style="color:var(--mute);font-size:14px;padding:14px 0 20px">Nothing needs your attention right now. Notifications appear when cards come due, a topic drops below 75%, or an exam gets close.</p>`,
 p=>{$$('[data-n]',p).forEach(b=>b.onclick=()=>{closeSheet();n[+b.dataset.n].go();});
   const s=$('#nset',p);if(s)s.onclick=()=>{closeSheet();go('profile');};});}

SCREENS.onboard=()=>`<div class="scr" style="padding-top:calc(var(--sat) + 60px)">
 <div style="display:flex;justify-content:center;color:var(--mint);margin-bottom:22px">${clover(5,74,{g:true})}</div>
 <h1 style="text-align:center;font-size:27px">Welcome to Gai Wanted</h1>
 <p style="text-align:center;color:var(--mute);font-size:14.5px;line-height:1.55;margin:10px 0 30px">
  Courses, decks, spaced repetition and real progress tracking — for every class you take, not just one.</p>
 <button class="btn b-pri" id="obSample">${I.sparkle} Start with a sample course</button>
 <button class="btn b-sec" id="obCourse">${I.plus} Create my first course</button>
 <button class="btn b-ghost" data-go="import">${I.up} Import material I already have</button>
 <p style="text-align:center;font-size:12px;color:var(--mute);margin-top:20px;line-height:1.5">
  Everything is stored on this device. Nothing is uploaded.</p></div>`;
WIRE.onboard=()=>{
 $('#obSample').onclick=()=>{seedSample();DB.onboarded=true;save();go('home',null,{replace:true});toast('Sample course added');};
 $('#obCourse').onclick=()=>newCourseSheet();
};

/* =============================================================== LIBRARY */
let libTab='courses',libSort='recent',libQ='',picking=null;
SCREENS.library=()=>{
 const q=libQ.toLowerCase();
 let courses=Course.all(),decks=Deck.all();
 if(q){courses=courses.filter(c=>(c.name+' '+c.code).toLowerCase().includes(q));
       decks=decks.filter(d=>d.name.toLowerCase().includes(q));}
 const sorter={recent:(a,b)=>(b.lastStudied||b.created)-(a.lastStudied||a.created),
   created:(a,b)=>b.created-a.created,az:(a,b)=>a.name.localeCompare(b.name),
   most:(a,b)=>Topic.mastery(Deck.cards(b.id))-Topic.mastery(Deck.cards(a.id)),
   least:(a,b)=>Topic.mastery(Deck.cards(a.id))-Topic.mastery(Deck.cards(b.id)),
   due:(a,b)=>Deck.cards(b.id).filter(c=>P.due(c.id)).length-Deck.cards(a.id).filter(c=>P.due(c.id)).length,
   fav:(a,b)=>(b.fav?1:0)-(a.fav?1:0)};
 decks=decks.slice().sort(sorter[libSort]||sorter.recent);
 const favCards=Stats.allCards().filter(c=>c.fav);
 const arch=Course.all(true).filter(c=>c.archived).length+Deck.all(true).filter(d=>d.archived).length;
 return `<div class="scr">
  <div class="tbar"><div class="grow"><h2>Library</h2>
    <div class="sub">${Course.all().length} courses · ${Deck.all().length} decks · ${Stats.allCards().length} cards</div></div>
   <button class="ib" id="libAdd" aria-label="Add">${I.plus}</button></div>

  <div style="display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:0 13px;min-height:46px;margin-bottom:14px">
   <span style="color:var(--mute);display:flex;width:18px">${I.srch}</span>
   <input id="libq" placeholder="Search courses and decks" value="${esc(libQ)}"
    style="flex:1;min-width:0;font-size:15.5px;padding:12px 0"></div>

  <div class="chips" style="margin-bottom:6px">
   <button class="chip" data-lt="courses" aria-pressed="${libTab==='courses'}">Courses</button>
   <button class="chip" data-lt="decks" aria-pressed="${libTab==='decks'}">All decks</button>
   <button class="chip" data-lt="fav" aria-pressed="${libTab==='fav'}">Favorites</button>
   ${arch?`<button class="chip" data-lt="arch" aria-pressed="${libTab==='arch'}">Archive</button>`:''}
  </div>

  ${libTab==='decks'?`<div style="display:flex;justify-content:flex-end;margin:12px 0 0">
   <button class="chip" id="sortBtn" style="min-height:34px;padding:7px 12px;font-size:12.5px">
    Sort: ${({recent:'Recent',created:'Created',az:'A–Z',most:'Most progress',least:'Least progress',due:'Most due',fav:'Favorites'})[libSort]}</button></div>`:''}

  ${libTab==='courses'?(courses.length?`<div class="lst" style="margin-top:10px">${courses.map(courseRow).join('')}</div>
    <button class="btn b-sec" style="margin-top:16px" id="newCo">${I.plus} New course</button>`
   :emptyBlock('No courses yet','Courses hold your decks. Make one per class.','newCo','Create a course')):''}

  ${libTab==='decks'?(decks.length?`<div class="lst" style="margin-top:6px">${decks.map(d=>`
     <div style="position:relative">${deckRow(d)}
      <button class="ib" data-dmenu="${d.id}" aria-label="Deck options"
       style="position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:transparent;border:0">${I.more}</button>
     </div>`).join('')}</div>
     <button class="btn b-sec" style="margin-top:16px" id="multi">${I.cards} Study multiple decks</button>`
   :emptyBlock('No decks yet','Decks live inside a course.','newDk','Create a deck')):''}

  ${libTab==='fav'?(favCards.length?`<div class="sect"><h3>Favorite cards (${favCards.length})</h3></div>
     <button class="btn b-pri" style="margin-bottom:12px" id="studyFav">${I.cards} Study favorites</button>
     <div class="lst">${favCards.map(c=>cardRow(c)).join('')}</div>`
   :emptyBlock('No favorites yet','Star a card while studying and it lands here.')):''}

  ${libTab==='arch'?`<div class="sect"><h3>Archived</h3></div>
   <div class="lst">${Course.all(true).filter(c=>c.archived).map(c=>`<button class="li" data-unarch-c="${c.id}">
     <span class="ic">${I.book}</span><span class="mid"><b>${esc(c.name)}</b><span>Course · tap to restore</span></span></button>`).join('')}
    ${Deck.all(true).filter(d=>d.archived).map(d=>`<button class="li" data-unarch-d="${d.id}">
     <span class="ic">${I.cards}</span><span class="mid"><b>${esc(d.name)}</b><span>Deck · tap to restore</span></span></button>`).join('')}</div>`:''}
 </div>`;
};
function emptyBlock(h,p,btnId,btnLabel){
 return `<div class="empty"><div class="art" style="color:var(--mute)">${clover(4,46)}</div>
  <h3>${h}</h3><p>${p}</p>${btnId?`<button class="btn b-pri" id="${btnId}">${btnLabel}</button>`:''}</div>`;}
WIRE.library=()=>{
 const q=$('#libq');
 q.oninput=e=>{libQ=e.target.value;const p=e.target.selectionStart;paint();
   const n=$('#libq');if(n){n.focus();n.setSelectionRange(p,p);}};
 $$('[data-lt]').forEach(b=>b.onclick=()=>{libTab=b.dataset.lt;paint();});
 const add=()=>sheet('Add to library',`<div class="lst">
   <button class="li" id="ac"><span class="ic" style="color:var(--sky)">${I.book}</span>
    <span class="mid"><b>New course</b><span>A class, subject, or topic area</span></span></button>
   <button class="li" id="ad"><span class="ic" style="color:var(--mint)">${I.cards}</span>
    <span class="mid"><b>New deck</b><span>A set of cards inside a course</span></span></button>

    <span class="mid"><b>Import</b><span>From a file or pasted notes</span></span></button></div>`,
  p=>{$('#ac',p).onclick=()=>{closeSheet();newCourseSheet();};
      $('#ad',p).onclick=()=>{closeSheet();go('newdeck');};
      $('#ai',p).onclick=()=>{closeSheet();go('import');};});
 $('#libAdd').onclick=add;
 ['newCo','newDk'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>id==='newCo'?newCourseSheet():go('newdeck');});
 const m=$('#multi');if(m)m.onclick=()=>go('multi');
 const sf=$('#studyFav');if(sf)sf.onclick=()=>startSession('flash',{cards:Stats.allCards().filter(c=>c.fav),label:'Favorites'});
 const sb=$('#sortBtn');if(sb)sb.onclick=()=>sheet('Sort decks by',
   `<div class="lst">${Object.entries({recent:'Recently studied',created:'Recently created',az:'Alphabetical',
     most:'Most progress',least:'Least progress',due:'Most due',fav:'Favorites first'})
    .map(([k,l])=>`<button class="li" data-s="${k}"><span class="mid"><b>${l}</b></span>
     ${libSort===k?`<span style="color:var(--sky);display:flex;width:18px">${I.chk}</span>`:''}</button>`).join('')}</div>`,
   p=>$$('[data-s]',p).forEach(b=>b.onclick=()=>{libSort=b.dataset.s;closeSheet();paint();}));
 $$('[data-dmenu]').forEach(b=>b.onclick=e=>{e.stopPropagation();deckMenu(b.dataset.dmenu);});
 $$('[data-unarch-c]').forEach(b=>b.onclick=()=>{Course.get(b.dataset.unarchC).archived=false;save();paint();toast('Course restored');});
 $$('[data-unarch-d]').forEach(b=>b.onclick=()=>{Deck.get(b.dataset.unarchD).archived=false;save();paint();toast('Deck restored');});
 bindFav();
};

function newCourseSheet(edit){
 const c=edit?Course.get(edit):null;
 const COLORS=['#4CC2FF','#3EE0A0','#FFC759','#FF7B6B','#5B7CFA','#C084FC','#F472B6','#94A3B8'];
 let color=c?c.color:COLORS[0];
 sheet(c?'Edit course':'New course',`
  <div class="fld"><label>Course name</label><input class="inp" id="cn" placeholder="e.g. Data Management" value="${esc(c?c.name:'')}"></div>
  <div class="fld"><label>Code (optional)</label><input class="inp" id="cc" placeholder="e.g. D426" value="${esc(c?c.code:'')}"></div>
  <div class="fld"><label>Color</label><div class="chips" id="cols">
   ${COLORS.map(x=>`<button class="chip" data-c="${x}" aria-pressed="${x===color}"
    style="width:44px;padding:0;min-height:44px"><span style="display:block;width:20px;height:20px;border-radius:50%;background:${x};margin:auto"></span></button>`).join('')}
  </div></div>
  <div class="fld"><label>Exam or OA date (optional)</label>
   <input class="inp" id="cd" type="date" value="${c&&c.exam?new Date(c.exam.date).toISOString().slice(0,10):''}"></div>
  <button class="btn b-pri" id="cs">${c?'Save':'Create course'}</button>
  ${c?`<button class="btn b-ghost" id="carch">${c.archived?'Restore':'Archive'} course</button>
      <button class="btn b-dang" id="cdel">Delete course</button>`:''}`,
 p=>{
  $$('[data-c]',p).forEach(b=>b.onclick=()=>{color=b.dataset.c;
    $$('[data-c]',p).forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#cs',p).onclick=()=>{
    const name=$('#cn',p).value.trim()||'New course',code=$('#cc',p).value.trim(),dt=$('#cd',p).value;
    if(c){c.name=name;c.code=code;c.color=color;c.exam=dt?{date:new Date(dt+'T12:00').getTime(),label:'OA'}:null;}
    else{const id=Course.add(name,code,color);if(dt)Course.get(id).exam={date:new Date(dt+'T12:00').getTime(),label:'OA'};}
    save();closeSheet();paint();toast(c?'Course saved':'Course created');};
  if(c){$('#carch',p).onclick=()=>{c.archived=!c.archived;save();closeSheet();go('library',null,{replace:true});};
    $('#cdel',p).onclick=()=>{closeSheet();confirmSheet('Delete course?',
      `“${esc(c.name)}”, its ${Course.decks(c.id).length} decks and ${Course.cards(c.id).length} cards will be removed along with your progress. This can't be undone.`,
      'Delete permanently',()=>{Course.del(c.id);go('library',null,{replace:true});toast('Course deleted');});};}
 });
}

/* ================================================================ COURSE */
SCREENS.course=(id)=>{
 const c=Course.get(id);if(!c)return SCREENS.library();
 const decks=Course.decks(id),cards=Course.cards(id);
 const m=Topic.mastery(cards),due=Stats.dueCount(cards),weak=Topic.weak(cards);
 const topics=Topic.map(cards);
 const b=[0,1,2,3,4].map(l=>cards.filter(x=>P.lvOf(x.id)===l).length);
 const days=c.exam?Math.ceil((c.exam.date-now())/DAY):null;
 return `<div class="scr">
  <div class="tbar"><button class="ib" data-back aria-label="Back">${I.back}</button>
   <div class="grow"><h2 style="font-size:18px">${esc(c.name)}</h2>
    <div class="sub">${c.code?c.code+' · ':''}${decks.length} decks · ${cards.length} cards</div></div>

  <div style="display:flex;align-items:center;gap:18px;padding:6px 0 18px">
   ${ringHTML(m,86,9,c.color)}
   <div style="flex:1">
    <div style="font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1">${m}%</div>
    <div style="font-size:12.5px;color:var(--mute);font-weight:700;margin-top:4px">Course mastery</div>
    ${days!=null&&days>=0?`<div style="font-size:12.5px;color:var(--gold);font-weight:700;margin-top:8px">
      ${I.cal} ${days} day${days!==1?'s':''} to your ${esc(c.exam.label||'exam')}</div>`:''}
   </div></div>

  <div class="brow" style="margin-bottom:6px">
   <button class="btn b-pri" id="coStudy">${I.brain} Continue studying</button>
   ${due?`<button class="btn b-sec" id="coRev" style="flex:0 0 34%">${due} due</button>`:''}</div>

  <div class="sect"><h3>Mastery breakdown</h3></div>
  <div class="lst">${[4,3,2,1,0].map(l=>b[l]?`<button class="li" data-lvl="${id}:${l}">
    <span style="width:9px;height:9px;border-radius:50%;background:${LVC[l]};flex:none"></span>
    <span class="mid"><b>${LV[l]}</b></span><span class="rt" style="color:${LVC[l]};font-size:16px">${b[l]}</span>
    <span class="chev">${I.chev}</span></button>`:'').join('')}</div>

 on('#qWeak',()=>startSession('learn',{cards:all.filter(c=>{const p=DB.prog[c.id];return p&&p.a>=2&&p.c/p.a<.7;}),label:'Weak cards'}));
 on('#qNew',()=>startSession('learn',{cards:all.filter(c=>!(DB.prog[c.id]||{}).a),label:'New material'}));
 on('#qFav',()=>{const f=all.filter(c=>c.fav);f.length?startSession('flash',{cards:f,label:'Favorites'}):toast('Star some cards first');});
 on('#qMulti',()=>go('multi'));
 $$('[data-focus]').forEach(b=>b.onclick=()=>{DB.focus={end:now()+ +b.dataset.focus*60000};save();paint();
   toast(b.dataset.focus+' minute focus started');});
 on('#focusStop',()=>{DB.focus=null;save();paint();});
 if(DB.focus){const t=$('#focusTxt');const tick=()=>{if(!DB.focus||!$('#focusTxt'))return;
   const left=Math.max(0,DB.focus.end-now());
   if(!left){DB.focus=null;save();toast('Focus session complete');paint();return;}
   $('#focusTxt').textContent=`${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')} remaining`;
   setTimeout(tick,1000);};tick();}
};

 }));

<script>
/* ===========================================================================
   SESSION ENGINE
   One state object drives Learn / Review / Cram / Test / Flashcards.
   Wrong answers are re-queued a few slots ahead (#22) — never immediately.
   =========================================================================== */
let S=null;

const MODE_LABEL={learn:'Learn',flash:'Flashcards',test:'Practice test',review:'Review',cram:'Cram'};

/** Intelligent session builder (#21 #69): due → weak → new → strong filler. */
/* Round size scales off the session total rather than a fixed block count.
   Quizlet asks 7 per round in Speller and chunks large sets at 20; 20 is too
   long on a phone, so this lands between 5 and 12:
      20 items -> 5/round (4 rounds)     50 -> 8 (7 rounds)
     100 items -> 11/round (9 rounds)   250 -> 12 (21 rounds)            */
function roundSizeFor(total){
  if(total<=6)return Math.max(1,total);
  return Math.max(5,Math.min(12,Math.round(Math.sqrt(total*1.3))));
}
function buildQueue(cards,mode,cfg){
 cfg=cfg||{};
 const size=cfg.size||Math.min(cards.length,mode==='flash'?cards.length:30);
 const due=[],weak=[],fresh=[],solid=[];
 cards.forEach(c=>{
   const p=DB.prog[c.id];
   if(!p||!p.a)fresh.push(c);
   else if(P.due(c.id))due.push(c);
   else if(p.c/p.a<.75||p.lv<3)weak.push(c);
   else solid.push(c);
 });
 weak.sort((a,b)=>P.acc(a.id)-P.acc(b.id));
 if(mode==='cram'){                      // weakest first, hard cap
   const all=[...weak,...due,...fresh,...solid];
   return all.slice(0,size);
 }
 if(mode==='flash'||mode==='review')return shuffle(cards).slice(0,size);
 const newCap=Math.round(size*(cfg.newRatio??DB.prefs.newRatio));
 const out=[];
 const take=(arr,n)=>{for(let i=0;i<n&&arr.length;i++)out.push(arr.shift());};
 take(due,Math.min(due.length,size));
 take(weak,Math.max(0,size-out.length-newCap));
 take(fresh,Math.max(0,Math.min(newCap,size-out.length)));
 take(weak,size-out.length);
 take(solid,size-out.length);
 take(fresh,size-out.length);
 return shuffle(out).slice(0,size);
}

function startSession(mode,o){
 o=o||{};
 const cards=(o.cards||[]).filter(Boolean);
 if(!cards.length)return toast('No cards to study');
 const queue=o.queue||buildQueue(cards,mode,o.cfg);
 S={mode,label:o.label||'Study',deckId:o.deckId||null,courseId:o.courseId||null,
    pool:cards,queue,i:0,right:0,answered:0,streak:0,best:0,missed:[],requeued:{},
    t0:now(),cfg:o.cfg||{},types:o.types||null,streakMode:!!o.streakMode,
    answeredFlag:false,startLv:{},
    roundSize:roundSizeFor(queue.length),roundStart:0,roundNum:1,roundLog:[]};
 cards.forEach(c=>S.startLv[c.id]=P.lvOf(c.id));
 persistResume();
 go(mode==='flash'?'flash':(mode==='test'?'test':'learn'));
}
function persistResume(){
 if(!S||S.mode==='test'){DB.resume=null;save();return;}
 DB.resume={mode:S.mode,modeLabel:MODE_LABEL[S.mode],label:S.label,deckId:S.deckId,courseId:S.courseId,
   queue:S.queue.map(c=>c.id),i:S.i,right:S.right,answered:S.answered,streak:S.streak,best:S.best,
   missed:S.missed.map(c=>c.id),t0:S.t0,cfg:S.cfg};
 save();
}
function resumeSession(){
 const r=DB.resume;if(!r)return;
 const cards=r.queue.map(id=>DB.cards[id]).filter(Boolean);
 if(!cards.length){DB.resume=null;save();return toast('That session is no longer available');}
 S={mode:r.mode,label:r.label,deckId:r.deckId,courseId:r.courseId,pool:cards,queue:cards,
    i:Math.min(r.i,cards.length-1),right:r.right||0,answered:r.answered||0,streak:r.streak||0,best:r.best||0,
    missed:(r.missed||[]).map(id=>DB.cards[id]).filter(Boolean),requeued:{},t0:r.t0||now(),
    cfg:r.cfg||{},answeredFlag:false,startLv:{}};
 cards.forEach(c=>S.startLv[c.id]=P.lvOf(c.id));
 go(r.mode==='flash'?'flash':'learn');
}
function endSession(){
 if(!S)return go('home',null,{replace:true});
 const total=Math.max(1,S.answered);
 const pct=Math.round(S.right/total*100);
 const secs=Math.round((now()-S.t0)/1000);
 DB.sessions=DB.sessions||[];
 DB.sessions.push({id:uid('ss'),at:now(),mode:S.mode,label:S.label,deckId:S.deckId,courseId:S.courseId,
   total:S.answered,correct:S.right,pct,secs});
 if(DB.sessions.length>200)DB.sessions=DB.sessions.slice(-200);
 if(S.deckId)Deck.touch(S.deckId);
 else{const ids=new Set(S.queue.map(c=>c.deckId));ids.forEach(id=>Deck.touch(id));}
 const t=Stats.today();t.secs=(t.secs||0)+secs;
 DB.resume=null;save();
 go('results',null,{replace:true});
}

function checkStreak(){
 const lv=leavesFor(S.streak);
 if(lv&&leavesFor(S.streak-1)!==lv){
   FX.burst({count:28+lv*10,leaves:lv,speed:12+lv,size:7+lv,spread:96,tks:150});
   buzz([13,55,13,55,20]);
   toast(`${S.streak} in a row — ${lv}-leaf clover`);
 }
}
const PRAISE=['Nice work!','Correct!',"You're getting it!",'Locked in.','Great job!','Exactly.','Sharp.'];

/* session chrome shared by learn/flash */
function totalRounds(){return Math.max(1,Math.ceil(S.queue.length/S.roundSize));}
function sessionHead(){
 const total=S.queue.length;
 return `<div class="shd">
  <button class="ib" id="sQuit" aria-label="Exit session">${I.back}</button>
  <div class="ctr">
   <div class="cnt"><span id="cNow">${S.i}</span> <small>/ ${total}</small>
    <span id="cRound" style="color:var(--mute);font-weight:700;margin-left:6px">· Round ${S.roundNum} of ${totalRounds()}</span></div>
   <div class="bar"><i id="cBar" style="width:${S.i/total*100}%"></i></div></div>
  <div class="stk" id="stkC"><span style="color:var(--mint);display:flex" id="stkI">${clover(3,16,{stem:false})}</span>
   <span id="stkN">${S.streak}</span></div></div>`;
}
function headTick(){
 const n=$('#cNow');if(!n)return;
 n.textContent=S.i;
 $('#cBar').style.width=(S.i/S.queue.length*100)+'%';
 const r=$('#cRound');if(r)r.textContent=`· Round ${S.roundNum} of ${totalRounds()}`;
 const c=$('#stkC');c.classList.toggle('hot',S.streak>=5);
 $('#stkN').textContent=S.streak;
 $('#stkI').innerHTML=clover(leavesFor(S.streak)||3,16,{stem:false});
}
function quitSession(){
 if(!S||!S.answered)return back();
 sheet('End this session?',`<p style="color:var(--ink-2);font-size:14.5px;line-height:1.55;margin-bottom:16px">
  You're ${S.i} of ${S.queue.length} through. Your progress on answered cards is already saved.</p>
  <button class="btn b-pri" id="sv">Save and finish later</button>
  <button class="btn b-sec" id="fin">Finish and see results</button>
  <button class="btn b-ghost" id="ret">Keep studying</button>`,
 p=>{$('#sv',p).onclick=()=>{persistResume();closeSheet();go('home',null,{replace:true});toast('Session saved');};
     $('#fin',p).onclick=()=>{closeSheet();endSession();};
     $('#ret',p).onclick=closeSheet;});
}

/* ------------------------------------------------------------- LEARN --- */
SCREENS.learn=()=>{
 if(!S)return SCREENS.home();
 return `<div class="scr full">${sessionHead()}
  <div id="qb" style="flex:1"></div><div class="dock" id="dk"></div></div>`;
};
WIRE.learn=()=>{$('#sQuit').onclick=quitSession;renderQ();};

const dirKey=()=>DB.prefs.dir==='d2t'?'t':'d';
const askKey=()=>DB.prefs.dir==='d2t'?'d':'t';
function typeFor(i,card){
 if(S.types&&S.types.length)return S.types[i%S.types.length];
 if(S.mode==='cram')return Math.random()<.75?'mc':'tf';
 const lv=P.lvOf(card.id);
 const frac=i/Math.max(1,S.queue.length);
 if(lv<=1)return 'mc';                        // recognition while new
 if(lv===2)return Math.random()<.5?'mc':'tf';
 if(lv>=3&&frac>.35)return Math.random()<.55?'wr':'mc';   // recall once familiar
 if(frac>.6&&Math.random()<.25)return 'sata';
 return 'mc';
}
function distract(card,k,n){
 const same=S.pool.filter(c=>c.id!==card.id&&Topic.of(c)===Topic.of(card)&&c[k]!==card[k]);
 const any=S.pool.filter(c=>c.id!==card.id&&c[k]!==card[k]);
 const pick=shuffle(same).slice(0,n);
 if(pick.length<n)pick.push(...shuffle(any.filter(c=>!pick.includes(c))).slice(0,n-pick.length));
 if(pick.length<n){const glob=Object.values(DB.cards).filter(c=>c.id!==card.id&&c[k]!==card[k]&&!pick.includes(c));
   pick.push(...shuffle(glob).slice(0,n-pick.length));}
 return pick;
}
const TYPE_LABEL={mc:'Multiple choice',tf:'True / false',wr:'Write your answer',sata:'Select all that apply'};

function renderQ(){
 const qb=$('#qb'),dk=$('#dk');
 if(S.i>=S.queue.length)return endSession();
 const card=S.queue[S.i];
 S.answeredFlag=false;
 const type=typeFor(S.i,card);
 S.curType=type;
 const k=dirKey(),ask=askKey();
 headTick();
 const head=`<div class="qtype"><span class="tag">${TYPE_LABEL[type]}</span>
   <span class="topic">${esc(Topic.of(card))}</span>
   <span style="flex:1"></span>${pill(P.lvOf(card.id))}</div>`;
 dk.innerHTML='';

 if(type==='mc'){
   const opts=shuffle([card,...distract(card,k,3)]);
   qb.innerHTML=head+`<p class="qtxt">${esc(card[ask])}</p>
    <div id="op">${opts.map((o,x)=>`<button class="opt" data-x="${x}">
     <span class="mk">${I.chk}</span><span class="tx">${esc(o[k])}</span></button>`).join('')}</div>
    ${card.hint?`<button class="btn b-ghost b-sm" id="hintBtn" style="margin-top:6px">Show hint</button>`:''}
    <div id="fb"></div>`;
   $$('#op .opt').forEach(b=>b.onclick=()=>{
     if(S.answeredFlag)return;
     const picked=opts[+b.dataset.x],ok=picked.id===card.id;
     $$('#op .opt').forEach((o,x)=>{
       if(opts[x].id===card.id)o.classList.add('ok');
       else if(o===b){o.classList.add('bad');if(!REDUCED)o.classList.add('shake');}
       else o.classList.add('dim');});
     grade(card,ok?2:0,card[k],ok?null:picked[k]);});
 }
 else if(type==='tf'){
   const flip=Math.random()<.5;
   const other=distract(card,k,1)[0];
   const shown=flip&&other?other[k]:card[k];
   const isTrue=shown===card[k];
   qb.innerHTML=head+`<p class="qtxt">${esc(card[ask])}</p>
    <div class="panel" style="margin-bottom:16px;background:var(--raised);border-color:var(--line-2)">
     <span class="eyebrow" style="display:block;margin-bottom:6px">Proposed answer</span>
     <div style="font-size:16.5px;font-weight:700;line-height:1.42">${esc(shown)}</div></div>
    <div id="op"><button class="opt" data-v="1"><span class="mk">${I.chk}</span><span class="tx">True</span></button>
     <button class="opt" data-v="0"><span class="mk">${I.chk}</span><span class="tx">False</span></button></div>
    <div id="fb"></div>`;
   $$('#op .opt').forEach(b=>b.onclick=()=>{
     if(S.answeredFlag)return;
     const said=b.dataset.v==='1',ok=said===isTrue;
     $$('#op .opt').forEach(o=>{const v=o.dataset.v==='1';
       if(v===isTrue)o.classList.add('ok');
       else if(o===b){o.classList.add('bad');if(!REDUCED)o.classList.add('shake');}
       else o.classList.add('dim');});
     grade(card,ok?2:0,card[k],null);});
 }
 else if(type==='sata'){
   const topic=Topic.of(card);
   const right=shuffle(S.pool.filter(c=>Topic.of(c)===topic)).slice(0,Math.min(3,Math.max(2,2)));
   if(!right.includes(card))right[0]=card;
   const wrong=shuffle(S.pool.filter(c=>Topic.of(c)!==topic)).slice(0,3);
   if(wrong.length<2)return (S.curType='mc',renderQ());
   const opts=shuffle([...right,...wrong]);
   const rightIds=new Set(right.map(c=>c.id));
   const sel=new Set();
   qb.innerHTML=head+`<p class="qtxt">Which of these belong to <b>${esc(topic)}</b>?</p>
    <div id="op">${opts.map((o,x)=>`<button class="opt" data-x="${x}" aria-checked="false" role="checkbox">
     <span class="mk sq">${I.chk}</span><span class="tx">${esc(o[k])}</span></button>`).join('')}</div>
    <button class="btn b-sec" id="sub" style="margin-top:8px" disabled>Submit answer</button>
    <div id="fb"></div>`;
   $$('#op .opt').forEach(b=>b.onclick=()=>{
     if(S.answeredFlag)return;
     const x=+b.dataset.x;
     sel.has(x)?sel.delete(x):sel.add(x);
     b.setAttribute('aria-checked',sel.has(x));
     $('#sub').disabled=!sel.size;buzz(5);});
   $('#sub').onclick=()=>{
     if(S.answeredFlag)return;
     const chosen=new Set([...sel].map(x=>opts[x].id));
     const ok=chosen.size===rightIds.size&&[...chosen].every(id=>rightIds.has(id));
     $$('#op .opt').forEach((o,x)=>{
       const isR=rightIds.has(opts[x].id),picked=sel.has(x);
       if(isR)o.classList.add('ok');else if(picked)o.classList.add('bad');else o.classList.add('dim');});
     $('#sub').remove();
     grade(card,ok?2:0,right.map(c=>c[k]).join(' · '),null);};
 }
 else{ // written
   qb.innerHTML=head+`<p class="qtxt">${esc(card[ask])}</p>
    <input class="inp" id="wr" placeholder="Type the ${k==='t'?'term':'definition'}" autocomplete="off"
     autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn b-sec" id="chk" style="margin-top:11px">Check answer</button>
    <button class="btn b-ghost b-sm" id="dk2" style="margin-top:8px;width:100%">I don't know</button>
    <div id="fb"></div>`;
   const inp=$('#wr');
   const submit=blank=>{
     if(S.answeredFlag)return;
     const val=blank?'':inp.value;
     const a=norm(val),b=norm(card[k]);
     const ok=!blank&&(a===b||(a.length>4&&b.includes(a)&&a.length>=b.length*.7));
     inp.disabled=true;inp.style.borderColor=ok?'var(--mint)':'var(--red)';
     const c=$('#chk');if(c)c.remove();const d=$('#dk2');if(d)d.remove();
     grade(card,ok?2:0,card[k],blank?null:val);};
   $('#chk').onclick=()=>submit(false);
   $('#dk2').onclick=()=>submit(true);
   inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit(false);}};
   setTimeout(()=>inp.focus(),50);
 }
 const hb=$('#hintBtn');
 if(hb)hb.onclick=()=>{hb.outerHTML=`<div class="fb"><div class="why" style="color:var(--gold)">${esc(card.hint)}</div></div>`;};
}

/** Grade, update mastery, re-queue misses, render compact feedback. */
function grade(card,g,correctAns,yourAns){
 S.answeredFlag=true;S.answered++;
 const before=P.lvOf(card.id);
 P.mark(card.id,g);
 const after=P.lvOf(card.id);
 const ok=g>0;
 if(ok){S.right++;S.streak++;S.best=Math.max(S.best,S.streak);checkStreak();buzz(11);}
 else{
   S.streak=0;
   if(!S.missed.some(c=>c.id===card.id))S.missed.push(card);
   buzz(28);
   if(S.streakMode){                       // Streak Challenge: one miss ends the run
     const best=DB.gameBest||(DB.gameBest={});
     if(!best.streak||S.best>best.streak)best.streak=S.best;
     save();
     const fb0=$('#fb');
     if(fb0)fb0.innerHTML=`<div class="fb bad"><div class="hd">${I.x}<span>Run over at ${S.best} in a row.</span></div>
       <div class="ans">Correct answer: ${esc(correctAns)}</div>
       <div class="why">${best.streak===S.best?'That is your new best.':'Your best is '+best.streak+'.'}</div></div>`;
     const dk0=$('#dk');
     if(dk0){dk0.innerHTML=`<button class="btn b-pri" id="nx">See results ${I.chev}</button>`;
       $('#nx').onclick=()=>endSession();}
     return;
   }
   // re-queue 3–4 slots ahead; sooner each repeat miss (#22)
   const n=(S.requeued[card.id]=(S.requeued[card.id]||0)+1);
   const gap=n>=3?2:n===2?3:4;
   const at=Math.min(S.queue.length,S.i+gap);
   if(n<=3)S.queue.splice(at,0,card);
 }
 save();persistResume();

 const praise=PRAISE[(Math.random()*PRAISE.length)|0];
 const lvUp=after>before&&ok;
 S.roundLog.push({t:card.t,d:card.d,ask:card[askKey()],
   correct:correctAns,mine:yourAns,ok,topic:Topic.of(card),type:S.curType,id:card.id});

 const fb=$('#fb');
 fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}">
   <div class="hd">${ok?I.chk:I.x}<span>${ok?praise:'Not quite.'}</span>
     ${lvUp?`<span class="tag" style="background:${LVC[after]}22;color:${LVC[after]}">→ ${LV[after]}</span>`:''}</div>
   ${!ok?`<div class="ans">Correct answer: ${esc(correctAns)}</div>`:''}
   ${card.expl?`<div class="why">${esc(card.expl)}</div>`:''}
   <div class="more">
     ${!ok&&yourAns?`<button id="whyBtn">Why was my answer wrong?</button>`:''}
     ${!card.expl?`<button id="expBtn">${I.sparkle} Explain this</button>`:''}
     <button id="favBtn">${card.fav?'Unstar':'Star this card'}</button>
   </div><div id="expOut"></div></div>`;

 const w=$('#whyBtn');
 if(w)w.onclick=()=>aiExplain(card,`The student answered "${yourAns}" but the correct answer is "${correctAns}". Explain in 2-3 sentences why their answer is wrong and why the correct one is right.`,w);
 const e=$('#expBtn');
 if(e)e.onclick=()=>aiExplain(card,`Explain this concept in 2-3 plain sentences, then give one short concrete example.`,e);
 const f=$('#favBtn');
 f.onclick=()=>{card.fav=!card.fav;save();f.textContent=card.fav?'Unstar':'Star this card';buzz(8);};

 // Continue — live immediately. Optional pacing bar only (#12 #35 #98)
 const dk=$('#dk');
 const last=S.i>=S.queue.length-1;
 dk.innerHTML=`<button class="btn b-pri" id="nx">${last?'See results':'Continue'} ${I.chev}</button>`;
 const nx=$('#nx');
 const wait=DB.prefs.pause;
 if(wait){nx.disabled=true;setTimeout(()=>{if($('#nx'))$('#nx').disabled=false;},wait*1000);}
 nx.onclick=()=>{
   if(nx.disabled)return;
   S.i++;persistResume();
   const done=S.i>=S.queue.length;
   const roundOver=(S.i-S.roundStart)>=S.roundSize;
   if(done||roundOver)renderCheckpoint(done);else renderQ();};
 if(!wait)requestAnimationFrame(()=>nx.focus({preventScroll:true}));
}
/* PROGRESS CHECKPOINT — shown between rounds.

 buzz(pct>=80?[12,45,12]:14);

    <span class="ck-mk">${x.ok?I.chk:I.x}</span>

     <div class="ck-q">${esc(x.ask)}</div>
     ${x.ok
       ?`<div class="ck-a good">${esc(x.correct)}</div>`
       :`${x.mine?`<div class="ck-a mine"><span>You said</span>${esc(x.mine)}</div>`

         <div class="ck-a good"><span>Answer</span>${esc(x.correct)}</div>`}
     <div class="ck-topic">${esc(x.topic)}</div>
    </div></div>`).join('')}

 dk.innerHTML=`<button class="btn b-pri" id="ckGo">${isLast?'See results':'Continue to round '+(S.roundNum+1)} ${I.chev}</button>`;

}

WIRE.flash=()=>{
 const fc=$('#fc'),st=$('#stage'),oN=$('#oN'),oY=$('#oY'),rw=$('#rateWrap');
 let flipped=false;
 const d2t=()=>DB.prefs.dir==='d2t';
 function load(){
   if(S.i>=S.queue.length)return endSession();
   const c=S.queue[S.i];flipped=false;
   fc.classList.remove('flip','out','drag','snap');
   fc.style.transform='';fc.style.opacity='';
   oN.style.opacity=oY.style.opacity=0;

   rw.innerHTML=`<button class="btn b-sec" id="reveal">Reveal answer</button>`;
   $('#reveal').onclick=flip;
   headTick();
 }
 function flip(){
   flipped=!flipped;fc.classList.toggle('flip',flipped);buzz(7);
   rw.innerHTML=flipped?`<div class="rate4">
     <button data-g="0" style="color:var(--red)">Again<small>&lt; 1 min</small></button>
     <button data-g="1" style="color:var(--gold)">Hard<small>${IVL[1]}d</small></button>
     <button data-g="2" style="color:var(--sky)">Good<small>${IVL[2]}d</small></button>
     <button data-g="3" style="color:var(--mint)">Easy<small>${IVL[4]}d</small></button></div>`
    :`<button class="btn b-sec" id="reveal">Reveal answer</button>`;
   if(flipped)$$('#rateWrap [data-g]').forEach(b=>b.onclick=()=>rate(+b.dataset.g));
   else $('#reveal').onclick=flip;
 }
 function rate(g){
   const c=S.queue[S.i];
   S.answered++;
   P.mark(c.id,g);
   if(g>0){S.right++;S.streak++;S.best=Math.max(S.best,S.streak);checkStreak();}
   else{S.streak=0;if(!S.missed.some(x=>x.id===c.id))S.missed.push(c);buzz(24);
     const n=(S.requeued[c.id]=(S.requeued[c.id]||0)+1);
     if(n<=2)S.queue.splice(Math.min(S.queue.length,S.i+4),0,c);}
   save();
   fc.classList.remove('drag','snap');fc.classList.add('out');
   fc.style.transform=`translate(${g>0?540:-540}px,${g>0?-40:40}px) rotate(${g>0?24:-24}deg)`;
   fc.style.opacity='0';
   setTimeout(()=>{S.i++;persistResume();load();},REDUCED?0:180);
 }
 let sx=0,sy=0,dx=0,dy=0,drag=false,t0=0,W=1;
 st.addEventListener('pointerdown',e=>{
   if(e.target.closest('#fFav'))return;
   drag=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t0=performance.now();
   W=st.clientWidth||innerWidth;fc.classList.add('drag');fc.classList.remove('snap');
   try{st.setPointerCapture(e.pointerId);}catch(_){}});
 st.addEventListener('pointermove',e=>{
   if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;
   if(Math.abs(dx)<4&&Math.abs(dy)<4)return;
   fc.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx*.045}deg)`+(flipped?' rotateY(180deg)':'');
   const p=Math.min(1,Math.abs(dx)/(W*.4));
   oY.style.opacity=dx>0?p:0;oN.style.opacity=dx<0?p:0;});
 const end=e=>{
   if(!drag)return;drag=false;try{st.releasePointerCapture(e.pointerId);}catch(_){}
   const dist=Math.abs(dx),dt=performance.now()-t0;
   if(dist>W*.32||(dist>60&&dt<260))return rate(dx>0?2:0);
   if(dist<9&&Math.abs(dy)<9&&dt<320){fc.classList.remove('drag');fc.style.transform=flipped?'rotateY(180deg)':'';
     oN.style.opacity=oY.style.opacity=0;return flip();}
   fc.classList.remove('drag');fc.classList.add('snap');
   fc.style.transform=flipped?'rotateY(180deg)':'';
   oN.style.opacity=oY.style.opacity=0;};
 st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
 $('#fFav').onclick=e=>{e.stopPropagation();const c=S.queue[S.i];c.fav=!c.fav;save();
   const f=$('#fFav');f.classList.toggle('on',c.fav);f.innerHTML=c.fav?I.star:I.starO;buzz(8);};
 $('#sQuit').onclick=quitSession;
 load();
};

function resolveScope(arg){
 if(!arg)return{cards:Stats.allCards(),label:'All courses',deckId:null};
 const s=String(arg);
 if(s.startsWith('scope:')){const v=s.slice(6);
   if(v==='all')return{cards:Stats.allCards(),label:'All courses'};
   if(v.startsWith('c:')){const c=Course.get(v.slice(2));return{cards:Course.cards(v.slice(2)),label:c?c.name:'Course',courseId:v.slice(2)};}}
 const d=Deck.get(s);
 if(d)return{cards:Deck.cards(s),label:d.name,deckId:s};
 const c=Course.get(s);
 if(c)return{cards:Course.cards(s),label:c.name,courseId:s};
 return{cards:Stats.allCards(),label:'All courses'};
}
function splitTypes(n,types){
 const on=Object.keys(types).filter(k=>types[k]);
 const out={mc:0,tf:0,sata:0,wr:0};
 if(!on.length)return out;
 const base=Math.floor(n/on.length);on.forEach(k=>out[k]=base);
 let rem=n-base*on.length,i=0;while(rem-->0){out[on[i%on.length]]++;i++;}
 return out;
}

 $$('[data-d]').forEach(b=>b.onclick=()=>{testCfg.diff=b.dataset.d;paint();});

   if(testCfg.diff==='hard')cards=cards.filter(c=>{const p=DB.prog[c.id];return p&&p.a>=2&&p.c/p.a<.8;});
   if(testCfg.diff==='mast')cards=cards.filter(c=>P.lvOf(c.id)===4);
   if(!cards.length)return toast('No cards match those filters');
   const n=Math.min(testCfg.n,cards.length);
   const mix=splitTypes(n,testCfg.types);
   const types=[];Object.entries(mix).forEach(([k,v])=>{for(let i=0;i<v;i++)types.push(k);});
   startSession('test',{cards,label:scope.label,deckId:scope.deckId,courseId:scope.courseId,
     queue:shuffle(cards).slice(0,n),types:shuffle(types)});
 };
};

   const s=(performance.now()-t0)/1000;$('#mTime').textContent=s.toFixed(1)+'s';
   $('#mBar').style.width=Math.min(100,s/60*100)+'%';requestAnimationFrame(tick);};
 tick();
 $$('#mg .mtile').forEach(b=>b.onclick=()=>{

    <input class="inp" data-f="hint" data-i="${i}" placeholder="Hint" value="${esc(c.hint||'')}" style="padding:11px 13px;font-size:14.5px">
   </div></div>`;
 const draw=()=>{wrap.innerHTML=draft.cards.map(row).join('');$('#eCnt').textContent=draft.cards.length+' cards';bind();};
 const bind=()=>{
   $$('[data-f]',wrap).forEach(inp=>inp.oninput=e=>draft.cards[+inp.dataset.i][inp.dataset.f]=e.target.value);
   $$('[data-del]',wrap).forEach(b=>b.onclick=()=>{draft.cards.splice(+b.dataset.del,1);
     if(!draft.cards.length)draft.cards.push({t:'',d:''});draw();buzz(10);});
   $$('[data-dup]',wrap).forEach(b=>b.onclick=()=>{const i=+b.dataset.dup;
     draft.cards.splice(i+1,0,{...draft.cards[i],id:undefined});draw();buzz(8);});
   $$('[data-exp]',wrap).forEach(b=>b.onclick=()=>{const i=+b.dataset.exp;
     draft.cards[i]._open=!draft.cards[i]._open;
     $(`[data-more="${i}"]`,wrap).style.display=draft.cards[i]._open?'block':'none';});
   $$('[data-f="d"]',wrap).forEach(inp=>inp.onkeydown=e=>{
     if(e.key==='Enter'){e.preventDefault();const i=+inp.dataset.i;
