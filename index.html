       const nx=$(`[data-f="t"][data-i="${i+1}"]`,wrap);if(nx)nx.focus();}});
 };
 draw();
 $('#eAdd').onclick=()=>{draft.cards.push({t:'',d:''});draw();
   const l=$$('[data-f="t"]',wrap).pop();if(l)l.focus();};
 $('#ePaste').onclick=()=>pasteSheet(cards=>{draft.cards=draft.cards.filter(c=>c.t||c.d).concat(cards);draw();});
 $('#eAI').onclick=()=>aiGenerate(cards=>{draft.cards=draft.cards.filter(c=>c.t||c.d).concat(cards);draw();});
 $('#eBack').onclick=()=>{draft=null;back();};
 $('#eSave').onclick=()=>{
   const clean=draft.cards.filter(c=>c.t.trim()&&c.d.trim());
   if(!clean.length)return toast('Add at least one complete card');
   const existing=new Set(Deck.cards(id).map(c=>c.id));
   const keep=new Set();
   clean.forEach(c=>{
     if(c.id&&DB.cards[c.id]){Object.assign(DB.cards[c.id],{t:c.t.trim(),d:c.d.trim(),topic:(c.topic||'').trim(),
       expl:(c.expl||'').trim(),hint:(c.hint||'').trim()});keep.add(c.id);}
     else{const nid=Card.add(id,c.t.trim(),c.d.trim(),{topic:(c.topic||'').trim(),expl:(c.expl||'').trim(),hint:(c.hint||'').trim()});keep.add(nid);}
   });
   existing.forEach(cid=>{if(!keep.has(cid)){delete DB.cards[cid];delete DB.prog[cid];}});
   save();draft=null;go('deck',id,{replace:true});toast(clean.length+' cards saved');
 };
};

const DELIMS={tab:/\t+/,dash:/\s+[-–—]\s+/,pipe:/\s*\|\s*/,colon:/\s*:\s+/,comma:/\s*,\s*/};
function parseText(text,delim,rowk){
 const rows=text.split(rowk==='semi'?/[;\n]+/:/\n+/).map(l=>l.trim()).filter(Boolean);
 const out=[];
 for(const line of rows){
   let parts=null;
   if(delim==='auto'){for(const k of ['tab','dash','pipe','colon','comma']){
     const p=line.split(DELIMS[k]);
     if(p.length>=2&&p[0].trim()&&p.slice(1).join(' ').trim()){parts=p;break;}}}
   else parts=line.split(DELIMS[delim]);
   if(!parts||parts.length<2)continue;
   const t=parts[0].trim(),d=parts.slice(1).join(delim==='comma'?', ':' ').trim();
   if(t&&d)out.push({t,d,topic:'',expl:'',hint:''});
 }
 return out;
}
function pasteSheet(onAdd){
 let delim='auto',rowk='nl',text='',found=[];
 sheet('Paste your notes',`
  <p style="color:var(--ink-2);font-size:13.5px;line-height:1.55;margin-bottom:13px">
   One card per line: term, a separator, then the definition.</p>
  <textarea class="inp" id="pt" placeholder="Zero-shot prompting - No examples given in the prompt&#10;Few-shot prompting - A few examples guide the model"></textarea>
  <div class="fld" style="margin-top:13px"><label>Separator</label><div class="chips" id="dl">
   ${[['auto','Auto-detect'],['tab','Tab'],['dash','Dash  -'],['pipe','Pipe  |'],['colon','Colon  :'],['comma','Comma']]
    .map(([k,l],i)=>`<button class="chip" data-k="${k}" aria-pressed="${i===0}">${l}</button>`).join('')}</div></div>
  <div class="fld"><label>New card on</label><div class="chips" id="rw">
   <button class="chip" data-r="nl" aria-pressed="true">New line</button>
   <button class="chip" data-r="semi">Semicolon or new line</button></div></div>
  <div id="pv" style="margin-bottom:13px"></div>
  <button class="btn b-pri" id="pAdd" disabled>Add cards</button>`,
 p=>{
  const ta=$('#pt',p),pv=$('#pv',p),btn=$('#pAdd',p);
  const upd=()=>{found=parseText(text,delim,rowk);
   btn.disabled=!found.length;
   btn.textContent=found.length?`Review ${found.length} card${found.length>1?'s':''}`:'Add cards';
   if(!text.trim())return pv.innerHTML='';
   pv.innerHTML=found.length
    ?`<span class="eyebrow" style="display:block;margin-bottom:8px">Preview · first ${Math.min(3,found.length)} of ${found.length}</span>`+
      found.slice(0,3).map(c=>`<div class="panel" style="margin-bottom:7px;padding:12px 13px">
       <div style="font-weight:700;font-size:14.5px;margin-bottom:3px">${esc(c.t)}</div>
       <div style="font-size:13px;color:var(--mute);line-height:1.4">${esc(c.d)}</div></div>`).join('')
    :`<div class="fb bad"><div class="hd">${I.x}<span>No cards found</span></div>
      <div class="why">No line split cleanly into a term and a definition. Try Auto-detect, or pick the separator your notes actually use.</div></div>`;};
  ta.oninput=e=>{text=e.target.value;upd();};
  $$('[data-k]',p).forEach(b=>b.onclick=()=>{delim=b.dataset.k;
    $$('[data-k]',p).forEach(x=>x.setAttribute('aria-pressed',x===b));upd();});
  $$('[data-r]',p).forEach(b=>b.onclick=()=>{rowk=b.dataset.r;
    $$('[data-r]',p).forEach(x=>x.setAttribute('aria-pressed',x===b));upd();});
  btn.onclick=()=>{closeSheet();onAdd?onAdd(found):stageImport(found,'Pasted notes');};
 });
}

WIRE.import=()=>{

     st.innerHTML=`<div class="fb bad"><div class="hd">${I.x}<span>Can't read .${esc(ext)} files</span></div>

     $('#pb').style.width=(12+si*26)+'%';}},200);
   const rd=new FileReader();
   rd.onerror=()=>{clearInterval(tk);st.innerHTML=`<div class="fb bad"><div class="hd">${I.x}<span>We couldn't read that file</span></div>
     <div class="why">It may be corrupted or not plain text.</div></div>`;};
   rd.onload=()=>{clearInterval(tk);
     const cards=parseText(String(rd.result),'auto','nl');
     $('#pb').style.width='100%';
     setTimeout(()=>{
       if(!cards.length){st.innerHTML=`<div class="fb bad"><div class="hd">${I.x}<span>No cards could be built</span></div>

   rd.readAsText(f);fi.value='';
 };
};

/* ================================================================== AI -- */
/* Real calls. If unavailable, say so plainly rather than faking a result. */
async function askClaude(prompt,system){
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
     system:system||'You are a concise study tutor. Be accurate and brief.',
     messages:[{role:'user',content:prompt}]})});
 if(!r.ok)throw new Error('HTTP '+r.status);
 const d=await r.json();
 return (d.content||[]).map(x=>x.type==='text'?x.text:'').join('').trim();
}
async function aiExplain(card,ask,btn){
 const out=$('#expOut');if(!out)return;
 btn.disabled=true;btn.textContent='Thinking…';
 out.innerHTML=`<div class="exp" style="color:var(--mute)">Working on it…</div>`;
 try{
   const co=Card.courseOf(card),dk=Card.deckOf(card);
   const txt=await askClaude(
     `Course: ${co?co.name:'General study'}\nDeck: ${dk?dk.name:''}\nTopic: ${Topic.of(card)}\n`+
     `Term: ${card.t}\nDefinition: ${card.d}\n\n${ask}`,
     'You are a sharp, concise study tutor. No preamble, no markdown headers. Maximum 4 sentences.');
   out.innerHTML=`<div class="exp">${esc(txt)}</div>
     <button class="btn b-ghost b-sm" id="saveExp" style="margin-top:9px;width:100%">Save this to the card</button>`;
   $('#saveExp').onclick=()=>{card.expl=txt;save();toast('Saved to card');$('#saveExp').remove();};
   btn.remove();
 }catch(e){
   out.innerHTML=`<div class="exp" style="color:var(--red)">Couldn't reach the explanation service just now. Everything else keeps working — try again in a moment.</div>`;
   btn.disabled=false;btn.textContent='Try again';
 }
}
function aiGenerate(onCards){
 sheet('Generate cards from text',`
  <p style="color:var(--ink-2);font-size:13.5px;line-height:1.55;margin-bottom:12px">
   Paste a chapter, your notes, or a lecture transcript. You'll review and edit every card before anything saves.</p>
  <textarea class="inp" id="gt" placeholder="Paste your source material here…"></textarea>
  <div class="fld" style="margin-top:12px"><label>How many cards</label><div class="chips" id="gn">
   ${[10,20,30].map((n,i)=>`<button class="chip" data-n="${n}" aria-pressed="${i===1}">${n}</button>`).join('')}</div></div>
  <button class="btn b-pri" id="gGo" disabled>${I.sparkle} Generate</button>
  <div id="gOut" style="margin-top:12px"></div>`,
 p=>{
  let n=20;
  const ta=$('#gt',p),btn=$('#gGo',p),out=$('#gOut',p);
  ta.oninput=()=>btn.disabled=ta.value.trim().length<40;
  $$('[data-n]',p).forEach(b=>b.onclick=()=>{n=+b.dataset.n;
    $$('[data-n]',p).forEach(x=>x.setAttribute('aria-pressed',x===b));});
  btn.onclick=async()=>{
    btn.disabled=true;btn.textContent='Generating…';
    out.innerHTML=`<div class="exp" style="color:var(--mute)">Reading your material and drafting cards…</div>`;
    try{
      const txt=await askClaude(
        `Create exactly ${n} study flashcards from this material. Return ONLY a JSON array, no prose, no code fences. `+
        `Each element: {"t":"term or question","d":"clear concise answer","topic":"short topic label"}.\n\nMATERIAL:\n`+
        ta.value.slice(0,14000),
        'You output raw JSON arrays only. Never wrap in markdown. Never add commentary.');
      const clean=txt.replace(/```json|```/g,'').trim();
      const arr=JSON.parse(clean.slice(clean.indexOf('['),clean.lastIndexOf(']')+1));
      const cards=arr.filter(x=>x&&x.t&&x.d).map(x=>({t:String(x.t),d:String(x.d),topic:String(x.topic||''),expl:'',hint:''}));
      if(!cards.length)throw new Error('empty');
      closeSheet();onCards(cards);toast(cards.length+' cards drafted — review them');
    }catch(e){
      out.innerHTML=`<div class="fb bad"><div class="hd">${I.x}<span>Generation didn't work</span></div>
        <div class="why">The generator couldn't be reached or returned something unusable. You can still paste cards
        manually with the Paste option — that always works offline.</div></div>`;
      btn.disabled=false;btn.textContent='Try again';}
  };
 });
}
